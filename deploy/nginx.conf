# Пример для VPS: nginx + php-fpm. Замените example.kz и пути.
server {
    listen 80;
    listen [::]:80;
    server_name example.kz www.example.kz;
    return 301 https://example.kz$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.kz;
    ssl_certificate     /etc/letsencrypt/live/example.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.kz/privkey.pem;
    return 301 https://example.kz$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.kz;
    root /var/www/chemodan/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/example.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 40m;            # загрузка нескольких фото в админке
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;

    location ~ /\.            { return 404; }
    location = /router.php    { return 404; }
    location ^~ /uploads/ {
        location ~ \.php$ { return 404; }   # запрет выполнения скриптов в загрузках
        expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404;
    }
    location ^~ /assets/      { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    location / { try_files $uri /index.php$is_args$args; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
}
